# the attribute `version` is obsolete, it will be ignored, please remove it to avoid potential confusion
# version: '3.8'

# Environment optimization to prevent layer caching issues
x-common-env: &common-env
  # Production logging (no DEBUG output)
  LOGGING_LEVEL_ROOT: "WARN"
  LOGGING_LEVEL_COM_THREATDETECTION: "INFO"
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_KAFKA: "INFO"
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: "INFO"
  
  # Hibernate optimization
  SPRING_JPA_OPEN_IN_VIEW: "true"
  SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "false"
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${DB_POOL_MAX_SIZE:-10}
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${DB_POOL_MIN_IDLE:-2}
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: 3000

services:
  postgres:
    image: postgres:15-alpine
    hostname: postgres
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-threat_detection}
      POSTGRES_USER: ${POSTGRES_USER:-threat_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./00-schema-migrations.sql:/docker-entrypoint-initdb.d/00-schema-migrations.sql
      - ./01-init-db-production-safe.sql:/docker-entrypoint-initdb.d/01-init-db-production-safe.sql
      - ./17-customers-init.sql:/docker-entrypoint-initdb.d/17-customers-init.sql
      - ./02-attack-events-storage.sql:/docker-entrypoint-initdb.d/02-attack-events-storage.sql
      - ./port_weights_migration.sql:/docker-entrypoint-initdb.d/03-port-weights.sql
      - ./04-alert-management-tables.sql:/docker-entrypoint-initdb.d/04-alert-management-tables.sql
      - ./04-threat-assessment-tables.sql:/docker-entrypoint-initdb.d/04-threat-assessment-tables.sql
      - ./05-notification-config-tables.sql:/docker-entrypoint-initdb.d/05-notification-config-tables.sql
      - ./06-ip-segment-weights.sql:/docker-entrypoint-initdb.d/06-ip-segment-weights.sql
      - ./07-whitelist-config.sql:/docker-entrypoint-initdb.d/07-whitelist-config.sql
      - ./08-threat-labels.sql:/docker-entrypoint-initdb.d/08-threat-labels.sql
      - ./09-add-missing-fields.sql:/docker-entrypoint-initdb.d/09-add-missing-fields.sql
      - ./10-device-status-history.sql:/docker-entrypoint-initdb.d/10-device-status-history.sql
      - ./12-ip-segment-weights-v4.sql:/docker-entrypoint-initdb.d/12-ip-segment-weights-v4.sql
      - ./13-customer-port-weights.sql:/docker-entrypoint-initdb.d/13-customer-port-weights.sql
      - ./14-apt-temporal-accumulations.sql:/docker-entrypoint-initdb.d/14-apt-temporal-accumulations.sql
      - ./15-attack-phase-port-configs.sql:/docker-entrypoint-initdb.d/15-attack-phase-port-configs.sql
      - ./16-temporal-device-mapping.sql:/docker-entrypoint-initdb.d/16-temporal-device-mapping.sql
      - ./17-customer-time-weights.sql:/docker-entrypoint-initdb.d/17-customer-time-weights.sql
      - ./18-net-segment-weights.sql:/docker-entrypoint-initdb.d/18-net-segment-weights.sql
      - ./19-device-inventory.sql:/docker-entrypoint-initdb.d/19-device-inventory.sql
      - ./20-topology-snapshots.sql:/docker-entrypoint-initdb.d/20-topology-snapshots.sql
      - ./21-discovered-hosts.sql:/docker-entrypoint-initdb.d/21-discovered-hosts.sql
      - ./22-threat-indicators.sql:/docker-entrypoint-initdb.d/22-threat-indicators.sql
      - ./23-threat-intel-feeds.sql:/docker-entrypoint-initdb.d/23-threat-intel-feeds.sql
      - ./24-threat-intel-feed-seeds.sql:/docker-entrypoint-initdb.d/24-threat-intel-feed-seeds.sql
      - ./25-threat-indicators-phase2-upgrade.sql:/docker-entrypoint-initdb.d/25-threat-indicators-phase2-upgrade.sql
      - ./27-ml-weight-columns.sql:/docker-entrypoint-initdb.d/27-ml-weight-columns.sql
      - ./26-ml-detection-tables.sql:/docker-entrypoint-initdb.d/26-ml-detection-tables.sql
      - ./28-region-support.sql:/docker-entrypoint-initdb.d/28-region-support.sql
      - ./29-rbac-tables.sql:/docker-entrypoint-initdb.d/29-rbac-tables.sql
      - ./30-system-config.sql:/docker-entrypoint-initdb.d/30-system-config.sql
      - ./31-tenants.sql:/docker-entrypoint-initdb.d/31-tenants.sql
      - ./32-tenant-customer-link.sql:/docker-entrypoint-initdb.d/32-tenant-customer-link.sql
      - ./33-plugin-configs.sql:/docker-entrypoint-initdb.d/33-plugin-configs.sql
      - ./34-tire-llm-multitenant.sql:/docker-entrypoint-initdb.d/34-tire-llm-multitenant.sql
      - ./35-config-assignments-v2.sql:/docker-entrypoint-initdb.d/35-config-assignments-v2.sql
      - ./37-config-cascading.sql:/docker-entrypoint-initdb.d/37-config-cascading.sql
      - ./38-auth-users-customer-fk.sql:/docker-entrypoint-initdb.d/38-auth-users-customer-fk.sql
      - ./39-score-breakdown-columns.sql:/docker-entrypoint-initdb.d/39-score-breakdown-columns.sql
      - ./40-device-status-history-columns.sql:/docker-entrypoint-initdb.d/40-device-status-history-columns.sql
      - ./41-auth-users-tenant-id.sql:/docker-entrypoint-initdb.d/41-auth-users-tenant-id.sql
      - ./42-performance-foundation.sql:/docker-entrypoint-initdb.d/42-performance-foundation.sql
      - ./43-customer-admin-role.sql:/docker-entrypoint-initdb.d/43-customer-admin-role.sql
      - ./44-device-flow-observability.sql:/docker-entrypoint-initdb.d/44-device-flow-observability.sql
      - ./45-device-binding-integrity.sql:/docker-entrypoint-initdb.d/45-device-binding-integrity.sql
      - ./46-threat-window-idempotency.sql:/docker-entrypoint-initdb.d/46-threat-window-idempotency.sql
      - ./47-overview-query-performance.sql:/docker-entrypoint-initdb.d/47-overview-query-performance.sql
      - ./48-threat-intel-feed-contract.sql:/docker-entrypoint-initdb.d/48-threat-intel-feed-contract.sql
      - ./49-notification-runtime-reliability.sql:/docker-entrypoint-initdb.d/49-notification-runtime-reliability.sql
    networks:
      - threat-detection-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" && psql -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -Atqc \"SELECT to_regclass('public.port_risk_configs') IS NOT NULL AND to_regclass('public.whitelist_config') IS NOT NULL AND to_regclass('public.auth_users') IS NOT NULL AND to_regclass('public.device_status_history') IS NOT NULL\" | grep -qx t"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    hostname: zookeeper
    ports: ["2181:2181"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - threat-detection-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    hostname: redis
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    networks:
      - threat-detection-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  logstash:
    build: ../infrastructure/logging/logstash
    image: ${COMPOSE_PROJECT_NAME:-threat-detection}-logstash:${RELEASE_VERSION:-3.1.39}
    depends_on:
      - kafka
    ports:
      - "9080:9080/tcp"  # rsyslog 无 TLS
      - "9081:9081/tcp"  # rsyslog TLS 预留
      - "9600:9600"      # 监控 API
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
    volumes:
      - logstash_data:/usr/share/logstash/data
      - logstash_logs:/usr/share/logstash/logs
    networks:
      - threat-detection-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9600/_node/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  emqx:
    image: emqx/emqx:5.5.1
    hostname: emqx
    ports:
      - "1883:1883"      # MQTT TCP
      - "8883:8883"      # MQTT TLS (预留)
      - "${EMQX_WS_HOST_PORT:-18084}:8083" # MQTT WebSocket (host:container)
      - "18083:18083"    # EMQX Dashboard
    environment:
      # Single-node deployment: let the image derive node.name from its current
      # container IP so `emqx ctl status` can reach the running Erlang node.
      # Allow anonymous for dev; production should disable
      EMQX_ALLOW_ANONYMOUS: "true"
      EMQX_LOADED_PLUGINS: "emqx_dashboard"
      EMQX_LISTENER__TCP__EXTERNAL: "1883"
      EMQX_LISTENER__WS__EXTERNAL: "8083"
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    networks:
      - threat-detection-network
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    hostname: kafka
    depends_on:
      - zookeeper
    ports: ["9092:9092", "9101:9101"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-12}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks:
      - threat-detection-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    restart: unless-stopped

  data-ingestion:
    build:
      context: ..
      dockerfile: services/data-ingestion/Dockerfile
      # ✅ Prevent layer caching issues
      cache_from: []
      # Build args to invalidate cache on timestamp changes
      args:
        BUILD_DATE: ${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}
        USE_CHINA_MIRROR: ${USE_CHINA_MIRROR:-false}
    image: ${COMPOSE_PROJECT_NAME:-threat-detection}-data-ingestion:${RELEASE_VERSION:-3.1.39}
    hostname: data-ingestion
    depends_on:
      - kafka
      - redis
    ports: ["8080:8080"]
    environment:
      <<: *common-env
      SPRING_PROFILES_ACTIVE: docker
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-threat_detection}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-threat_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SPRING_KAFKA_PRODUCER_ACKS: all
      SPRING_KAFKA_PRODUCER_COMPRESSION_TYPE: zstd
      SPRING_KAFKA_PRODUCER_BATCH_SIZE: 65536
      SPRING_KAFKA_PRODUCER_PROPERTIES_ENABLE_IDEMPOTENCE: "true"
      SPRING_KAFKA_PRODUCER_PROPERTIES_LINGER_MS: 10
      KAFKA_CONSUMER_CONCURRENCY: ${KAFKA_CONSUMER_CONCURRENCY:-4}
      INGEST_EXECUTOR_CORE_SIZE: ${INGEST_EXECUTOR_CORE_SIZE:-8}
      INGEST_EXECUTOR_MAX_SIZE: ${INGEST_EXECUTOR_MAX_SIZE:-16}
      INGEST_EXECUTOR_QUEUE_CAPACITY: ${INGEST_EXECUTOR_QUEUE_CAPACITY:-2000}
    networks:
      - threat-detection-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # ✅ Production resource limits
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 768M
    restart: unless-stopped

  stream-processing:
    build:
      context: ..
      dockerfile: services/stream-processing/Dockerfile
      # ✅ Prevent layer caching issues
      cache_from: []
      args:
        BUILD_DATE: ${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}
        USE_CHINA_MIRROR: ${USE_CHINA_MIRROR:-false}
    image: ${COMPOSE_PROJECT_NAME:-threat-detection}-stream-processing:${RELEASE_VERSION:-3.1.39}
    hostname: stream-processing
    depends_on:
      kafka:
        condition: service_healthy
      threat-assessment:
        condition: service_started
      topic-init:
        condition: service_completed_successfully
      flink-checkpoint-init:
        condition: service_completed_successfully
    ports: ["8081:8081"]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: stream-processing
        parallelism.default: ${FLINK_PARALLELISM:-2}
        taskmanager.numberOfTaskSlots: ${FLINK_TASK_SLOTS:-4}
        rest.port: 8081
        state.checkpoints.dir: file:///opt/flink/checkpoints
        execution.checkpointing.interval: 60s
        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.attempts: 3
        restart-strategy.fixed-delay.delay: 10s
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INPUT_TOPIC: attack-events
      STATUS_TOPIC: status-events
      OUTPUT_TOPIC: threat-alerts
      AGGREGATION_TOPIC: minute-aggregations
      JDBC_SINK_PARALLELISM: ${FLINK_JDBC_SINK_PARALLELISM:-2}
      APT_SINK_PARALLELISM: ${FLINK_APT_SINK_PARALLELISM:-1}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-threat_detection}
      DB_USER: ${POSTGRES_USER:-threat_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      
      # ✅ 端口权重服务配置 (Port Weight Service Integration)
      THREAT_ASSESSMENT_SERVICE_URL: http://threat-assessment:8082
      THREAT_INTEL_SERVICE_URL: http://threat-intelligence:8085
      
      # ✅ 时间窗口配置（可自定义）
      # 时长配置（单位：秒，推荐范围见下方说明）
      TIER1_WINDOW_SECONDS: "30"        # Tier 1 窗口时长（默认30秒，推荐范围：10-300秒）
      TIER2_WINDOW_SECONDS: "300"       # Tier 2 窗口时长（默认5分钟=300秒，推荐范围：60-1800秒）
      TIER3_WINDOW_SECONDS: "900"       # Tier 3 窗口时长（默认15分钟=900秒，推荐范围：300-7200秒）
      
      # 窗口名称配置（可自定义，用于告警描述）
      TIER1_WINDOW_NAME: "勒索软件快速检测"    # Tier 1 窗口名称
      TIER2_WINDOW_NAME: "主要威胁检测"        # Tier 2 窗口名称
      TIER3_WINDOW_NAME: "APT慢速扫描检测"     # Tier 3 窗口名称
    networks:
      - threat-detection-network
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/overview"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # ✅ Resource limits for Flink
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.5'
          memory: 1.5G
    restart: unless-stopped

  flink-checkpoint-init:
    image: ${COMPOSE_PROJECT_NAME:-threat-detection}-stream-processing:${RELEASE_VERSION:-3.1.39}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "install -d -m 0770 -o 9999 -g 9999 /opt/flink/checkpoints && chown -R 9999:9999 /opt/flink/checkpoints"
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
    restart: "no"

  taskmanager:
    image: ${COMPOSE_PROJECT_NAME:-threat-detection}-stream-processing:${RELEASE_VERSION:-3.1.39}
    hostname: taskmanager
    depends_on:
      stream-processing:
        condition: service_started
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: stream-processing
        taskmanager.numberOfTaskSlots: ${FLINK_TASK_SLOTS:-4}
        taskmanager.memory.process.size: 1728m
        state.checkpoints.dir: file:///opt/flink/checkpoints
    command: "taskmanager"
    networks:
      - threat-detection-network
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
    restart: unless-stopped

  threat-assessment:
    build:
      context: ..
      dockerfile: services/threat-assessment/Dockerfile
      # ✅ Prevent layer caching issues
      cache_from: []
      args:
        BUILD_DATE: ${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}
        USE_CHINA_MIRROR: ${USE_CHINA_MIRROR:-false}
    image: ${COMPOSE_PROJECT_NAME:-threat-detection}-threat-assessment:${RELEASE_VERSION:-3.1.39}
    hostname: threat-assessment
    depends_on:
      - kafka
      - postgres
    ports: ["8083:8083"]
    environment:
      <<: *common-env
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8083
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-threat_detection}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-threat_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      ML_WEIGHT_ENABLED: "true"
      ML_WEIGHT_CACHE_TTL: "300"
    networks:
      - threat-detection-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/api/v1/assessment/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # ✅ Production resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    restart: unless-stopped

  alert-management:
    build:
      context: ..
      dockerfile: services/alert-management/Dockerfile
      # ✅ Prevent layer caching issues - this was the root cause of past bugs!
      cache_from: []
      args:
        BUILD_DATE: ${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}
        USE_CHINA_MIRROR: ${USE_CHINA_MIRROR:-false}
    image: ${COMPOSE_PROJECT_NAME:-threat-detection}-alert-management:${RELEASE_VERSION:-3.1.39}
    hostname: alert-management
    depends_on:
      - kafka
      - postgres
    # Internal service only. Browser/API clients must use the authenticated
    # gateway on 8888; publishing 8082 would bypass gateway JWT/RBAC checks.
    expose: ["8082"]
    environment:
      <<: *common-env
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-threat_detection}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-threat_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_MAIL_HOST: ${SMTP_HOST:-smtp.163.com}
      SPRING_MAIL_PORT: ${SMTP_PORT:-25}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SMTP_AUTH:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS_ENABLED:-false}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:?CONFIG_ENCRYPTION_KEY is required}
      ALERT_INTERNAL_SERVICE_TOKEN: ${ALERT_INTERNAL_SERVICE_TOKEN:?ALERT_INTERNAL_SERVICE_TOKEN is required}
      ALERT_INGESTION_MINIMUM_SEVERITY: ${ALERT_INGESTION_MINIMUM_SEVERITY:-LOW}
      INTEGRATION_TEST_EMAIL_RECIPIENT: ${INTEGRATION_TEST_EMAIL_RECIPIENT:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-twilio}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME:-}
      ALIYUN_SMS_TEMPLATE_CODE: ${ALIYUN_SMS_TEMPLATE_CODE:-}
    networks:
      - threat-detection-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # ✅ Production resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    restart: unless-stopped

  customer-management:
    build:
      context: ..
      dockerfile: services/customer-management/Dockerfile
      # ✅ Prevent layer caching issues
      cache_from: []
      args:
        BUILD_DATE: ${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}
        USE_CHINA_MIRROR: ${USE_CHINA_MIRROR:-false}
    image: ${COMPOSE_PROJECT_NAME:-threat-detection}-customer-management:${RELEASE_VERSION:-3.1.39}
    hostname: customer-management
    depends_on:
      - postgres
    # Internal service only. In particular, do not expose the real notification
    # test proxy directly on the host and bypass gateway authorization.
    expose: ["8084"]
    environment:
      <<: *common-env
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-threat_detection}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-threat_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus,mappings
      DEVICE_EXPECTED_HEARTBEAT_INTERVAL_SECONDS: ${DEVICE_EXPECTED_HEARTBEAT_INTERVAL_SECONDS:-1800}
      DEVICE_HEARTBEAT_DELAYED_AFTER_SECONDS: ${DEVICE_HEARTBEAT_DELAYED_AFTER_SECONDS:-2100}
      DEVICE_HEARTBEAT_OFFLINE_AFTER_SECONDS: ${DEVICE_HEARTBEAT_OFFLINE_AFTER_SECONDS:-3900}
      DEVICE_DATA_ACTIVE_WINDOW_SECONDS: ${DEVICE_DATA_ACTIVE_WINDOW_SECONDS:-2100}
      ALERT_MANAGEMENT_URL: http://alert-management:8082
      ALERT_INTERNAL_SERVICE_TOKEN: ${ALERT_INTERNAL_SERVICE_TOKEN:?ALERT_INTERNAL_SERVICE_TOKEN is required}
    networks:
      - threat-detection-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # ✅ Production resource limits
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G
        reservations:
          cpus: '1.0'
          memory: 1G
    restart: unless-stopped

  threat-intelligence:
    build:
      context: ..
      dockerfile: services/threat-intelligence/Dockerfile
      cache_from: []
      args:
        BUILD_DATE: ${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}
        USE_CHINA_MIRROR: ${USE_CHINA_MIRROR:-false}
    image: ${COMPOSE_PROJECT_NAME:-threat-detection}-threat-intelligence:${RELEASE_VERSION:-3.1.39}
    hostname: threat-intelligence
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8085:8085"]
    environment:
      <<: *common-env
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-threat_detection}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-threat_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      OTX_API_KEY: ${OTX_API_KEY:-}
      VT_API_KEY: ${VT_API_KEY:-}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      GREYNOISE_API_KEY: ${GREYNOISE_API_KEY:-}
      FEED_POLLER_ENABLED: ${FEED_POLLER_ENABLED:-true}
    networks:
      - threat-detection-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  tire:
    build:
      context: ../services/tire
      dockerfile: Dockerfile
      args:
        USE_CHINA_MIRROR: ${USE_CHINA_MIRROR:-false}
    image: ${COMPOSE_PROJECT_NAME:-threat-detection}-tire:${RELEASE_VERSION:-3.1.39}
    hostname: tire
    environment:
      TIRE_FERNET_KEY: ${TIRE_FERNET_KEY:?TIRE_FERNET_KEY is required}
      SESSION_SECRET_KEY: ${TIRE_SESSION_SECRET:?TIRE_SESSION_SECRET is required}
      LLM_RUNTIME_CONFIG_URL: http://api-gateway:8888/internal/v1/runtime-config/llm/effective
      LLM_RUNTIME_SERVICE_TOKEN: ${TIRE_INTERNAL_SERVICE_TOKEN:?TIRE_INTERNAL_SERVICE_TOKEN is required}
      LLM_RUNTIME_CACHE_TTL_SECONDS: 45
      LLM_RUNTIME_STALE_TTL_SECONDS: 3600
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      OTX_API_KEY: ${OTX_API_KEY:-}
      GREYNOISE_API_KEY: ${GREYNOISE_API_KEY:-}
      VT_API_KEY: ${VT_API_KEY:-}
      SHODAN_API_KEY: ${SHODAN_API_KEY:-}
      THREATBOOK_API_KEY: ${THREATBOOK_API_KEY:-}
      TIANJIYOUMENG_API_KEY: ${TIANJIYOUMENG_API_KEY:-}
      LOG_LEVEL: INFO
    volumes:
      - tire_data:/app/data
    networks:
      - threat-detection-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
      # ✅ Prevent layer caching issues
      cache_from: []
      args:
        BUILD_DATE: ${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}
        USE_CHINA_MIRROR: ${USE_CHINA_MIRROR:-false}
    image: ${COMPOSE_PROJECT_NAME:-threat-detection}-api-gateway:${RELEASE_VERSION:-3.1.39}
    hostname: api-gateway
    depends_on:
      - redis
      - customer-management
      - data-ingestion
      - threat-assessment
      - alert-management
      - tire
    ports: ["8888:8888"]
    environment:
      <<: *common-env
      SPRING_PROFILES_ACTIVE: docker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8888
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_CAPACITY: 100
      RATE_LIMIT_REFILL_RATE: 10
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-threat_detection}
      POSTGRES_USER: ${POSTGRES_USER:-threat_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:?CONFIG_ENCRYPTION_KEY is required}
      TIRE_INTERNAL_SERVICE_TOKEN: ${TIRE_INTERNAL_SERVICE_TOKEN:?TIRE_INTERNAL_SERVICE_TOKEN is required}
      ALERT_INTERNAL_SERVICE_TOKEN: ${ALERT_INTERNAL_SERVICE_TOKEN:?ALERT_INTERNAL_SERVICE_TOKEN is required}
    networks:
      - threat-detection-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # ✅ Production resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1.5G
        reservations:
          cpus: '1.0'
          memory: 1G
    restart: unless-stopped

  config-server:
    build:
      context: ..
      dockerfile: services/config-server/Dockerfile
      # ✅ Prevent layer caching issues
      cache_from: []
      args:
        BUILD_DATE: ${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}
        USE_CHINA_MIRROR: ${USE_CHINA_MIRROR:-false}
    image: ${COMPOSE_PROJECT_NAME:-threat-detection}-config-server:${RELEASE_VERSION:-3.1.39}
    hostname: config-server
    ports: ["8899:8899"]
    environment:
      <<: *common-env
      SPRING_PROFILES_ACTIVE: native
      SERVER_PORT: 8899
      CONFIG_REPO_PATH: file:/config-repo
    volumes:
      - ../config-repo:/config-repo:ro
    networks:
      - threat-detection-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8899/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

  ml-detection:
    build:
      context: ../services/ml-detection
      dockerfile: Dockerfile
      args:
        USE_CHINA_MIRROR: ${USE_CHINA_MIRROR:-false}
    image: ${COMPOSE_PROJECT_NAME:-threat-detection}-ml-detection:${RELEASE_VERSION:-3.1.39}
    hostname: ml-detection
    depends_on:
      - kafka
      - postgres
    ports: ["8086:8086"]
    environment:
      ML_SERVICE_PORT: 8086
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_INPUT_TOPIC: threat-alerts
      KAFKA_OUTPUT_TOPIC: ml-threat-detections
      KAFKA_CONSUMER_GROUP: ml-detection-consumer
      MODEL_DIR: /app/models
      ML_CONFIDENCE_THRESHOLD: 0.3
      ML_DEFAULT_WEIGHT: 1.0
      DATA_READINESS_CACHE_SECONDS: ${DATA_READINESS_CACHE_SECONDS:-30}
      DATA_READINESS_QUERY_TIMEOUT_MS: ${DATA_READINESS_QUERY_TIMEOUT_MS:-5000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-threat_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-threat_detection}
      LOG_LEVEL: INFO
    networks:
      - threat-detection-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        USE_CHINA_MIRROR: ${USE_CHINA_MIRROR:-false}
        VITE_APP_VERSION: ${RELEASE_VERSION:-3.1.39}
    image: ${COMPOSE_PROJECT_NAME:-threat-detection}-frontend:${RELEASE_VERSION:-3.1.39}
    hostname: frontend
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        # The gateway can transiently report unhealthy while its downstream
        # services warm up on small hosts. Runtime readiness is enforced by
        # the installer; do not make that transient state abort Compose.
        condition: service_started
    networks:
      - threat-detection-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  topic-init:
    image: confluentinc/cp-kafka:7.4.0
    hostname: topic-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    environment:
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-12}
    command: >-
      "
      set -eu;
      for topic in attack-events status-events sniffer-events threat-detection-events policy-events bg-traffic-events audit-events threat-alerts minute-aggregations device-health-alerts ml-threat-detections; do
        kafka-topics --bootstrap-server kafka:29092 --if-not-exists --create --replication-factor 1 --partitions $$KAFKA_TOPIC_PARTITIONS --topic $$topic;
        current=$$(kafka-topics --bootstrap-server kafka:29092 --describe --topic $$topic | sed -n 's/.*PartitionCount: \\([0-9][0-9]*\\).*/\\1/p' | head -n1);
        if [ -n "$$current" ] && [ "$$current" -lt "$$KAFKA_TOPIC_PARTITIONS" ]; then
          kafka-topics --bootstrap-server kafka:29092 --alter --topic $$topic --partitions $$KAFKA_TOPIC_PARTITIONS;
        fi;
      done
      "
    networks:
      - threat-detection-network
    restart: "no"

volumes:
  postgres_data:
  logstash_data:
  logstash_logs:
  emqx_data:
  emqx_log:
  flink_checkpoints:
  tire_data:

networks:
  threat-detection-network:
    name: ${TDS_DOCKER_NETWORK:-threat-detection-network}

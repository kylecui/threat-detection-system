apiVersion: batch/v1
kind: CronJob
metadata:
  name: kafka-topic-init
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: kafka-topic-init
            image: confluentinc/cp-kafka:7.4.0
            imagePullPolicy: IfNotPresent
            command:
            - /bin/bash
            - -c
            - |
              # Wait for Kafka to be ready
              echo "Waiting for Kafka to be ready..."
              until kafka-broker-api-versions --bootstrap-server kafka:9092 >/dev/null 2>&1; do
                echo "Kafka not ready yet, retrying in 3s..."
                sleep 3
              done
              echo "Kafka is ready. Creating topics..."

              for topic in attack-events status-events threat-alerts minute-aggregations device-health-alerts sniffer-events threat-detection-events policy-events bg-traffic-events audit-events ml-threat-detections; do
                kafka-topics --bootstrap-server kafka:9092 --if-not-exists --create --replication-factor 1 --partitions 12 --topic "$topic"
                current="$(kafka-topics --bootstrap-server kafka:9092 --describe --topic "$topic" | sed -n 's/.*PartitionCount: \([0-9][0-9]*\).*/\1/p' | head -n1)"
                if [ -n "$current" ] && [ "$current" -lt 12 ]; then
                  kafka-topics --bootstrap-server kafka:9092 --alter --topic "$topic" --partitions 12
                fi
              done

              echo "All Kafka topics initialized successfully."
              kafka-topics --bootstrap-server kafka:9092 --list
          restartPolicy: Never
      backoffLimit: 3
